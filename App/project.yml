name: PTApp
options:
  bundleIdPrefix: com.ellenbartling
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "RLQ5M29933"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  PTAppCore:
    path: ../Packages/PTAppCore

targets:
  PTApp:
    type: application
    platform: iOS
    sources:
      - path: PTApp
    entitlements:
      path: PTApp/PTApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: PTApp/Info.plist
      properties:
        CFBundleDisplayName: Mend
        # Read from build settings so CI's build number reaches the app.
        # Without these, XcodeGen writes literal "1.0" / "1".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: "Used to scan your PT handout for setup."
        NSPhotoLibraryUsageDescription: "Used to pick photos of your PT handout."
        NSMicrophoneUsageDescription: "Lets you describe your exercises out loud instead of typing them."
        NSSpeechRecognitionUsageDescription: "Turns what you say into text on this iPhone so Mend can build your routine."
        NSHealthUpdateUsageDescription: "If you turn it on in Settings, Mend saves each PT session to Apple Health as a workout."
        NSHealthShareUsageDescription: "Mend doesn't read your Health data. It only saves your PT sessions as workouts, if you turn that on."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
    dependencies:
      - package: PTAppCore
        product: DataKit
      - package: PTAppCore
        product: ParsingKit
      - package: PTAppCore
        product: SessionKit
      - package: PTAppCore
        product: HistoryKit
      - package: PTAppCore
        product: UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenbartling.ptroutine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only for v1
