name: Mend

options:
  bundleIdPrefix: com.ellenbartling
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "RLQ5M29933"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    WATCHOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

configs:
  Debug: debug
  Release: release

targets:
  Mend:
    type: application
    platform: iOS
    sources:
      # MendKit compiles into both apps (no framework — one module per app).
      - path: Mend
      - path: MendKit
    dependencies:
      # A watchOS application dependency is embedded into
      # $(CONTENTS_FOLDER_PATH)/Watch by XcodeGen.
      - target: MendWatch
    info:
      path: Mend/Info.plist
      properties:
        CFBundleDisplayName: Mend
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: Mend reads workouts to show your exercise history alongside your physical therapy sessions.
        NSHealthUpdateUsageDescription: Mend saves your completed physical therapy sessions to Apple Health as workouts.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenbartling.mend
        CODE_SIGN_ENTITLEMENTS: Mend/Mend.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          # Keep device Debug builds on automatic signing despite Release's
          # manual style (same arrangement as ReadLater).
          CODE_SIGN_STYLE: Automatic
        Release:
          # TestFlight/App Store signing: manual with the Apple Distribution
          # cert + named profiles — see .github/workflows/ship-testflight.yml.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Mend App Store

  MendWatch:
    type: application
    platform: watchOS
    sources:
      - path: MendWatch
      - path: MendKit
    info:
      path: MendWatch/Info.plist
      properties:
        CFBundleDisplayName: Mend
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ellenbartling.mend
        NSHealthShareUsageDescription: Mend uses heart rate during your therapy session and shows your workout history.
        NSHealthUpdateUsageDescription: Mend saves your completed physical therapy sessions to Apple Health as workouts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenbartling.mend.watchkitapp
        CODE_SIGN_ENTITLEMENTS: MendWatch/MendWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Mend Watch App Store

  # NOTE: no `MendKit` in test sources — those files compile into the app
  # module and arrive via `@testable import Mend`. Adding them here too
  # creates a second copy of every type and ambiguous-type errors.
  MendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MendTests
    dependencies:
      - target: Mend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ellenbartling.mend.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mend.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)Mend
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Mend:
    build:
      targets:
        Mend: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MendTests
    archive:
      config: Release
