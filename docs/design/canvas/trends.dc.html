<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend — Trends</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); display: flex; flex-direction: column; overflow: hidden; --accent: {{accent}};">
  <div style="flex: 1; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <h1 style="margin: 0 0 2px; font-size: 28px; font-weight: 600; font-family: var(--font-display); letter-spacing: -0.01em;">Trends</h1>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 20px; font-weight: 700; font-family: var(--font-display); font-variant-numeric: tabular-nums;">2/3</div>
        <div style="font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; text-align: center;">This week</div>
      </div>
      <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 20px; font-weight: 700; font-family: var(--font-display); font-variant-numeric: tabular-nums;">5</div>
        <div style="font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; text-align: center;">Day streak</div>
      </div>
      <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 20px; font-weight: 700; font-family: var(--font-display); font-variant-numeric: tabular-nums;">3</div>
        <div style="font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; text-align: center;">Week streak</div>
      </div>
      <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 20px; font-weight: 700; font-family: var(--font-display); font-variant-numeric: tabular-nums;">42</div>
        <div style="font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; text-align: center;">Sessions</div>
      </div>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <div>
        <h2 style="margin: 0; font-size: 16px; font-weight: 600; font-family: var(--font-display);">Weekly sessions</h2>
        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4;">Days with a session vs. your 3×/week goal</div>
      </div>
      <div role="img" aria-label="Sessions per week over the last 8 weeks: 2, 3, 1, 3, 4, 2, 3, and 2 so far this week. Goal is 3.">
        <div style="position: relative; height: 120px; display: flex; align-items: flex-end;">
          <div style="position: absolute; left: 0; right: 0; top: 69px; border-top: 1px dashed var(--border-default);"></div>
          <div style="position: absolute; right: 0; top: 52px; font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em;">Goal</div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 34px; border-radius: 4px 4px 0 0; background: var(--accent); opacity: 0.55;"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 51px; border-radius: 4px 4px 0 0; background: var(--accent);"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 17px; border-radius: 4px 4px 0 0; background: var(--accent); opacity: 0.55;"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 51px; border-radius: 4px 4px 0 0; background: var(--accent);"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 68px; border-radius: 4px 4px 0 0; background: var(--accent);"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 34px; border-radius: 4px 4px 0 0; background: var(--accent); opacity: 0.55;"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 51px; border-radius: 4px 4px 0 0; background: var(--accent);"></div></div>
          <div style="flex: 1; display: flex; justify-content: center; align-items: flex-end; height: 100%;"><div style="width: 20px; height: 34px; border-radius: 4px 4px 0 0; border: 1.5px dashed var(--accent); border-bottom: none;"></div></div>
        </div>
        <div style="height: 1px; background: var(--border-default);"></div>
        <div style="display: flex; margin-top: 8px; font-size: 10px; font-weight: 500; color: var(--text-tertiary);">
          <div style="flex: 1; text-align: center;">Sep 20</div>
          <div style="flex: 1;"></div>
          <div style="flex: 1;"></div>
          <div style="flex: 1; text-align: center;">Oct 11</div>
          <div style="flex: 1;"></div>
          <div style="flex: 1;"></div>
          <div style="flex: 1;"></div>
          <div style="flex: 1; text-align: center; color: var(--text-secondary); font-weight: 600;">Now</div>
        </div>
      </div>
      <div style="display: flex; gap: 16px; font-size: 11px; color: var(--text-secondary);">
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent);"></span>Goal met</div>
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent); opacity: 0.55;"></span>Under goal</div>
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 3px; border: 1.5px dashed var(--accent);"></span>In progress</div>
      </div>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
        <div>
          <h2 style="margin: 0; font-size: 16px; font-weight: 600; font-family: var(--font-display);">Progression</h2>
          <div style="font-size: 12px; color: var(--text-secondary); margin-top: 3px;">Hold time per set</div>
        </div>
        <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; background: var(--bg-surface-2); border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 5px;">
          Side Plank
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <span style="font-size: 30px; font-weight: 600; font-family: var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;">32s</span>
        <span style="font-size: 12px; font-weight: 600; color: var(--success);">+14s since Oct 6</span>
      </div>
      <div>
        <svg width="308" height="96" viewBox="0 0 308 96" role="img" aria-label="Side plank hold time rose from 18 seconds on October 6 to 32 seconds on November 10, across six sessions."><line x1="0" y1="90" x2="308" y2="90" stroke="var(--border-subtle)" stroke-width="1"></line><polyline points="8,82 66,72.7 124,63.3 182,49.3 240,35.4 298,16.6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="8" cy="82" r="4" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"></circle><circle cx="66" cy="72.7" r="4" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"></circle><circle cx="124" cy="63.3" r="4" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"></circle><circle cx="182" cy="49.3" r="4" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"></circle><circle cx="240" cy="35.4" r="4" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2"></circle><circle cx="298" cy="16.6" r="5.5" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2.5"></circle></svg>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; font-weight: 500; color: var(--text-tertiary);">
          <span>Oct 6</span>
          <span style="color: var(--text-secondary); font-weight: 600;">Nov 10</span>
        </div>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; border-top: 1px solid var(--border-subtle); padding: 10px 0 30px; background: var(--bg-base);">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8.5 15l2.2 2.2L15.5 12.5"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Today</span>
    </a>
    <a href="trends.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--accent); filter: brightness(1.35);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 7-8"></path><path d="M15 8h5v5"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Trends</span>
    </a>
    <button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="18" x2="20" y2="18"></line><circle cx="4.5" cy="6" r="1.2"></circle><circle cx="4.5" cy="12" r="1.2"></circle><circle cx="4.5" cy="18" r="1.2"></circle></svg>
      <span style="font-size: 11px; font-weight: 600;">Routines</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F63E8","options":["#4F63E8","#7C5CFC","#2DD4BF","#FF7A45"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4F63E8' };
  }
}
</script>
</body>
</html>
