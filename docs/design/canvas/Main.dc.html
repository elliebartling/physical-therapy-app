<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend — Today</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div style="width: 390px; height: 844px; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-body); display: flex; flex-direction: column; overflow: hidden; --accent: {{accent}};">
  <div style="flex: 1; padding: 60px 20px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em;">Tuesday</div>
        <h1 style="margin: 2px 0 0; font-size: 28px; font-weight: 600; font-family: var(--font-display); letter-spacing: -0.01em;">November 10</h1>
      </div>
      <a href="import.dc.html" aria-label="Import a routine from screenshots" style="width: 44px; height: 44px; border-radius: 999px; background: var(--bg-surface); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; color: var(--text-primary);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M4 16v3a1 1 0 0 0 1 1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M16 20h3a1 1 0 0 0 1-1v-3"></path><line x1="12" y1="9" x2="12" y2="15"></line><line x1="9" y1="12" x2="15" y2="12"></line></svg>
      </a>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 18px;">
      <div style="position: relative; width: 72px; height: 72px; flex-shrink: 0;">
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="32.5" fill="none" stroke="var(--border-default)" stroke-width="7"></circle><circle cx="36" cy="36" r="32.5" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="204.2" stroke-dashoffset="68" transform="rotate(-90 36 36)"></circle></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">2/3</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em;">This week</div>
        <div style="font-size: 18px; font-weight: 600; font-family: var(--font-display);">1 more to go</div>
        <div style="display: flex; align-items: center; gap: 5px; color: var(--warning); margin-top: 2px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-3s2 1 2 4a6 6 0 1 1-12 0C5 7 9 6 12 2z"></path></svg>
          <span style="font-size: 12px; font-weight: 600;">5-day streak</span>
        </div>
      </div>
    </div>

    <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; filter: brightness(1.35);">Today's routine</div>
        <h2 style="margin: 6px 0 0; font-size: 21px; font-weight: 600; font-family: var(--font-display); letter-spacing: -0.01em;">Knee Rehab — Phase 2</h2>
        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">6 exercises · about 18 min</div>
      </div>

      <a href="player-timed.dc.html" style="height: 56px; border-radius: 999px; background: var(--accent); color: #FFFFFF; font-size: 16px; font-weight: 600; font-family: var(--font-display); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>
        Start session
      </a>

      <div style="display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
          <span style="font-size: 14px; font-weight: 500;">Bridges</span>
          <span style="font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;">3 × 10 reps</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
          <span style="font-size: 14px; font-weight: 500;">Clamshells</span>
          <span style="font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;">3 × 12 · each side</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);">
          <span style="font-size: 14px; font-weight: 500;">Side Plank</span>
          <span style="font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;">3 × 20s hold · each side</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 11px 0;">
          <span style="font-size: 14px; font-weight: 500;">Heel Raises</span>
          <span style="font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums;">2 × 15 reps</span>
        </div>
      </div>
      <div style="font-size: 12px; color: var(--text-tertiary); text-align: center; margin-top: -4px;">+ 2 more exercises</div>
    </div>
  </div>

  <nav aria-label="Main" style="display: flex; border-top: 1px solid var(--border-subtle); padding: 10px 0 30px; background: var(--bg-base);">
    <a href="Main.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--accent); filter: brightness(1.35);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8.5 15l2.2 2.2L15.5 12.5"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Today</span>
    </a>
    <a href="trends.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 7-8"></path><path d="M15 8h5v5"></path></svg>
      <span style="font-size: 11px; font-weight: 600;">Trends</span>
    </a>
    <button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="18" x2="20" y2="18"></line><circle cx="4.5" cy="6" r="1.2"></circle><circle cx="4.5" cy="12" r="1.2"></circle><circle cx="4.5" cy="18" r="1.2"></circle></svg>
      <span style="font-size: 11px; font-weight: 600;">Routines</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F63E8","options":["#4F63E8","#7C5CFC","#2DD4BF","#FF7A45"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#4F63E8' };
  }
}
</script>
</body>
</html>
