<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend — Accent color study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div style="box-sizing: border-box; width: 2620px; height: 954px; padding: 40px; background: #E4E2DC; display: flex; gap: 40px; font-family: 'IBM Plex Mono', monospace; color: #3D3C37;">
  <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.06em;">
        <span style="color: #111111; font-weight: 500;">{{s.label}}</span>
        <span>{{s.hex}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; box-shadow: 0 18px 50px rgba(17,17,17,0.18), 0 0 0 1px rgba(17,17,17,0.08);">
        <dc-import name="swissglass-timer" accent="{{s.hex}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2620,"height":954}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      swatches: [
        { label: 'SIGNAL', hex: '#FF5A1F' },
        { label: 'SKY', hex: '#3FA9F5' },
        { label: 'SUN', hex: '#FFC531' },
        { label: 'MINT', hex: '#2BD99F' },
        { label: 'BLOSSOM', hex: '#FF7EB6' },
        { label: 'LILAC', hex: '#A98BFF' }
      ]
    };
  }
}
</script>
</body>
</html>
