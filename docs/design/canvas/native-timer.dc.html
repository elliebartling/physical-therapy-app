<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend native — Timed hold</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@600;700&amp;display=swap">
<style>
body { margin: 0; }
* { box-sizing: border-box; }
button { font-family: inherit; border: none; background: none; padding: 0; cursor: pointer; }
a { text-decoration: none; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; flex-direction: column;">
  <div style="padding: 56px 16px 0; display: flex; align-items: center; justify-content: space-between;">
    <a href="native-today.dc.html" aria-label="End session" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; box-shadow: 0 4px 16px {{c.shadow}}; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); color: {{c.label}}; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </a>
    <div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">3 of 6</div>
    <button type="button" aria-label="More options" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; box-shadow: 0 4px 16px {{c.shadow}}; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); color: {{c.label}}; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
    </button>
  </div>

  <div role="img" aria-label="Exercise 3 of 6" style="margin: 16px 20px 0; display: flex; gap: 4px;">
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{tint}};"></div>
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{tint}};"></div>
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{c.fill}}; overflow: hidden;"><div style="width: 40%; height: 100%; background: {{tint}};"></div></div>
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{c.fill}};"></div>
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{c.fill}};"></div>
    <div style="flex: 1; height: 4px; border-radius: 999px; background: {{c.fill}};"></div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 0 20px; text-align: center;">
    <div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700;">Side Plank</h1>
      <div style="font-size: 17px; color: {{c.label2}}; margin-top: 4px;">Set 2 of 3 · Left Side</div>
    </div>

    <div style="position: relative; width: 270px; height: 270px;">
      <svg width="270" height="270" viewBox="0 0 270 270" role="img" aria-label="18 of 30 seconds remaining"><circle cx="135" cy="135" r="124" fill="none" stroke="{{c.fill}}" stroke-width="22"></circle><circle cx="135" cy="135" r="124" fill="none" stroke="{{tint}}" stroke-width="22" stroke-linecap="round" stroke-dasharray="779.1" stroke-dashoffset="311.6" transform="rotate(-90 135 135)"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-family: ui-rounded, 'SF Pro Rounded', Nunito, sans-serif; font-size: 80px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.01em;">0:18</div>
        <div style="font-size: 17px; color: {{c.label2}}; margin-top: 6px;">of 0:30</div>
      </div>
    </div>

    <div style="width: 100%; background: {{c.card}}; border-radius: 22px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-align: left;">
      <div style="width: 36px; height: 36px; border-radius: 999px; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; color: {{c.label}}; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </div>
      <div>
        <div style="font-size: 13px; font-weight: 600; color: {{c.label2}};">Up Next</div>
        <div style="font-size: 17px;">Rest 15 sec, then Right Side</div>
      </div>
    </div>
  </div>

  <div style="padding: 8px 40px 44px; display: flex; justify-content: space-between;">
    <button type="button" style="width: 84px; height: 84px; border-radius: 999px; background: {{c.fillStrong}}; color: {{c.label}}; font-size: 17px; font-weight: 600; box-shadow: 0 0 0 3px {{c.bg}}, 0 0 0 5px {{c.fillStrong}};">Skip</button>
    <button type="button" style="width: 84px; height: 84px; border-radius: 999px; background: {{tint}}; color: #FFFFFF; font-size: 17px; font-weight: 600; box-shadow: 0 0 0 3px {{c.bg}}, 0 0 0 5px {{tint}};">Pause</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tint":{"editor":"color","default":"#0066D6","options":["#0066D6","#C2410C","#0F7B6C","#7A3FD1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const tint = this.props.tint ?? '#0066D6';
    const light = {
      bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', label2: '#6A6A6F',
      fill: 'rgba(120,120,128,0.16)', fillStrong: '#E3E3E8',
      glass: 'rgba(255,255,255,0.62)', glassBorder: 'rgba(255,255,255,0.9)', shadow: 'rgba(0,0,0,0.12)'
    };
    const night = {
      bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', label2: '#98989F',
      fill: 'rgba(120,120,128,0.3)', fillStrong: '#333336',
      glass: 'rgba(44,44,48,0.55)', glassBorder: 'rgba(255,255,255,0.14)', shadow: 'rgba(0,0,0,0.5)'
    };
    return { c: dark ? night : light, tint };
  }
}
</script>
</body>
</html>
