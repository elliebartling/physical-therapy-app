<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend Swiss + Glass — Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div style="box-sizing: border-box; position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F2EE; color: #111111; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif; padding: 54px 20px 0;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="swissglass-today.dc.html" aria-label="Back" style="box-sizing: border-box; text-decoration: none; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(17,17,17,0.10), inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(17,17,17,0.05); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); color: #111111; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M20 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #57564F;">SETTINGS</div>
  </div>
  <div style="height: 2px; background: #111111; margin-top: 10px;"></div>

  <h1 style="margin: 20px 0 0; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;">Appearance</h1>

  <div style="margin-top: 22px; height: 1px; background: #111111;"></div>
  <div style="margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #57564F;">01 — ACCENT COLOR</div>

  <div style="margin-top: 16px; display: flex; gap: 18px; align-items: flex-start;">
    <div aria-label="Preview of the timer in the selected color" role="img" style="flex-shrink: 0; width: 149px; height: 321px; border-radius: 22px; overflow: hidden; box-shadow: 0 12px 30px rgba(17,17,17,0.18), 0 0 0 1px rgba(17,17,17,0.08);">
      <div style="zoom: 0.38;">
        <dc-import name="swissglass-timer" accent="{{accent}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 4px;">
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05;">{{name}}</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #57564F;">{{accent}}</div>
      <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: #3D3C37;">Fills the timer, today’s square and the start button. Text stays black, so every option stays readable.</p>
    </div>
  </div>

  <div role="group" aria-label="Accent color" style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <button type="button" aria-label="{{item.name}}" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="box-sizing: border-box; height: 60px; border: none; padding: 0; cursor: pointer; border-radius: 16px; background: {{item.hex}}; box-shadow: {{item.ring}}; color: #111111; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{item.selected}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
          </sc-if>
        </button>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #3D3C37; text-align: center;">{{item.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { id: 'signal', name: 'Signal', label: 'SIGNAL', hex: '#FF5A1F' },
      { id: 'sky', name: 'Sky', label: 'SKY', hex: '#3FA9F5' },
      { id: 'sun', name: 'Sun', label: 'SUN', hex: '#FFC531' },
      { id: 'mint', name: 'Mint', label: 'MINT', hex: '#2BD99F' },
      { id: 'blossom', name: 'Blossom', label: 'BLOSSOM', hex: '#FF7EB6' },
      { id: 'lilac', name: 'Lilac', label: 'LILAC', hex: '#A98BFF' }
    ];
    const picked = (this.state && this.state.picked) || 'signal';
    const current = list.find((s) => s.id === picked) || list[0];
    const items = list.map((s) => {
      const selected = s.id === picked;
      return {
        ...s,
        selected,
        pressed: selected ? 'true' : 'false',
        ring: selected ? '0 0 0 3px #F3F2EE, 0 0 0 5px #111111' : 'inset 0 0 0 1px rgba(17,17,17,0.08)',
        pick: () => this.setState({ picked: s.id })
      };
    });
    return { items, accent: current.hex, name: current.name };
  }
}
</script>
</body>
</html>
