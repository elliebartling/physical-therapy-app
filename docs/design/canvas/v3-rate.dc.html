<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend — Rate exercise during rest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div style="box-sizing: border-box; position: relative; width: 390px; height: 844px; overflow: hidden; background: #F3F2EE; color: #111111; font-family: 'Inter Tight', 'Helvetica Neue', Arial, sans-serif;">
  <div role="img" aria-label="Rest: 11 of 15 seconds remaining" style="position: absolute; left: 0; right: 0; bottom: 0; height: 411px; background: {{accent}};"></div>

  <div style="position: relative; padding: 54px 20px 0;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a href="v3-today.dc.html" aria-label="End session" style="box-sizing: border-box; text-decoration: none; width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(17,17,17,0.10), inset 0 1px 1px rgba(255,255,255,0.95), inset 0 -1px 1px rgba(17,17,17,0.05); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); color: #111111; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </a>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #57564F;">EXERCISE 03 / 06 — DONE</div>
    </div>
    <div style="height: 2px; background: #111111; margin-top: 10px;"></div>
    <div role="img" aria-label="3 of 6 exercises done" style="margin-top: 10px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px;">
      <div style="height: 4px; background: #111111;"></div>
      <div style="height: 4px; background: #111111;"></div>
      <div style="height: 4px; background: #111111;"></div>
      <div style="height: 4px; background: rgba(17,17,17,0.14);"></div>
      <div style="height: 4px; background: rgba(17,17,17,0.14);"></div>
      <div style="height: 4px; background: rgba(17,17,17,0.14);"></div>
    </div>

    <h1 style="margin: 26px 0 0; font-size: 68px; font-weight: 700; line-height: 0.9; letter-spacing: -0.05em;">Rest</h1>
    <div style="margin-top: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #57564F;">NEXT — SINGLE-LEG BRIDGE 3×8 L/R</div>

    <div style="margin-top: 26px; display: flex; align-items: flex-end; gap: 12px;">
      <div style="font-size: 120px; font-weight: 700; line-height: 0.78; letter-spacing: -0.07em; font-variant-numeric: tabular-nums;">11</div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em;">
        <span>SEC</span>
        <span style="color: #57564F;">OF 15</span>
      </div>
    </div>
  </div>

  <div role="dialog" aria-label="Rate side plank" style="box-sizing: border-box; position: absolute; left: 8px; right: 8px; bottom: 8px; height: 336px; border-radius: 40px; padding: 10px 20px 18px; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 -8px 40px rgba(17,17,17,0.16), inset 0 1px 1px rgba(255,255,255,0.95); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); display: flex; flex-direction: column;">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: rgba(17,17,17,0.22);"></div>
    <h2 style="margin: 16px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em;">How did side plank feel?</h2>
    <div style="margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #3D3C37;">OPTIONAL — CLOSES WHEN REST ENDS</div>

    <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <a href="v3-summary.dc.html" style="box-sizing: border-box; text-decoration: none; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(17,17,17,0.1); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95); color: #111111; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Easy</a>
      <a href="v3-summary.dc.html" style="box-sizing: border-box; text-decoration: none; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(17,17,17,0.1); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95); color: #111111; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">About right</a>
      <a href="v3-summary.dc.html" style="box-sizing: border-box; text-decoration: none; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1px solid rgba(17,17,17,0.1); box-shadow: inset 0 1px 1px rgba(255,255,255,0.95); color: #111111; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Hard</a>
      <a href="v3-summary.dc.html" style="box-sizing: border-box; text-decoration: none; height: 64px; border-radius: 20px; background: rgba(255,255,255,0.7); border: 1.5px solid #111111; box-shadow: inset 0 1px 1px rgba(255,255,255,0.95); color: #111111; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        Painful
      </a>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between;">
      <button type="button" style="box-sizing: border-box; cursor: pointer; min-height: 44px; padding: 0 4px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #111111;">Skip</button>
      <button type="button" style="box-sizing: border-box; cursor: pointer; min-height: 44px; padding: 0 4px; border: none; background: transparent; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; color: #111111; text-decoration: underline; text-underline-offset: 3px;">ASK AT THE END INSTEAD</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A1F","options":["#FF5A1F","#3FA9F5","#FFC531","#2BD99F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF5A1F' };
  }
}
</script>
</body>
</html>
