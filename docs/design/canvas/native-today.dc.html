<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mend native — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Nunito:wght@600;700&amp;display=swap">
<style>
body { margin: 0; }
* { box-sizing: border-box; }
button { font-family: inherit; border: none; background: none; padding: 0; cursor: pointer; }
a { text-decoration: none; }
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.bg}}; color: {{c.label}}; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif;">
  <div style="padding: 56px 16px 0; display: flex; justify-content: flex-end; gap: 10px;">
    <button type="button" aria-label="Import a routine" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; box-shadow: 0 4px 16px {{c.shadow}}; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); color: {{c.label}}; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <div style="padding: 2px 20px 0;">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 0.01em;">Today</h1>
    <div style="font-size: 15px; color: {{c.label2}}; margin-top: 2px;">Tuesday, November 10</div>
  </div>

  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 16px;">
    <div style="background: {{c.card}}; border-radius: 26px; padding: 18px; display: flex; align-items: center; gap: 16px;">
      <div style="position: relative; width: 64px; height: 64px; flex-shrink: 0;">
        <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="{{c.fill}}" stroke-width="10"></circle><circle cx="32" cy="32" r="27" fill="none" stroke="{{tint}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="56.5" transform="rotate(-90 32 32)"></circle></svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: ui-rounded, 'SF Pro Rounded', Nunito, sans-serif; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums;">2/3</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 13px; font-weight: 600; color: {{c.label2}};">This Week</div>
        <div style="font-size: 17px; font-weight: 600; line-height: 1.25;">1 more session to hit your goal</div>
        <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="{{c.flame}}" aria-hidden="true"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-2-1-3-1-3s2 1 2 4a6 6 0 1 1-12 0C5 7 9 6 12 2z"></path></svg>
          <span style="font-size: 15px; color: {{c.label2}};">5-day streak</span>
        </div>
      </div>
    </div>

    <div style="background: {{c.card}}; border-radius: 26px; padding: 18px 18px 6px; display: flex; flex-direction: column;">
      <div style="font-size: 13px; font-weight: 600; color: {{c.label2}};">Today’s Routine</div>
      <h2 style="margin: 4px 0 0; font-size: 22px; font-weight: 700;">Knee Rehab — Phase 2</h2>
      <div style="font-size: 15px; color: {{c.label2}}; margin-top: 2px;">6 exercises · 18 min</div>
      <a href="native-timer.dc.html" style="margin-top: 16px; height: 50px; border-radius: 999px; background: {{tint}}; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>
        Start Session
      </a>
      <div style="margin-top: 10px;">
        <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 0.5px solid {{c.sep}};">
          <span style="flex: 1; font-size: 17px;">Bridges</span>
          <span style="font-size: 15px; color: {{c.label2}}; font-variant-numeric: tabular-nums;">3 × 10</span>
        </div>
        <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 0.5px solid {{c.sep}};">
          <span style="flex: 1; font-size: 17px;">Clamshells</span>
          <span style="font-size: 15px; color: {{c.label2}}; font-variant-numeric: tabular-nums;">3 × 12 each side</span>
        </div>
        <div style="display: flex; align-items: center; min-height: 44px; border-bottom: 0.5px solid {{c.sep}};">
          <span style="flex: 1; font-size: 17px;">Side Plank</span>
          <span style="font-size: 15px; color: {{c.label2}}; font-variant-numeric: tabular-nums;">3 × 20s each side</span>
        </div>
        <div style="display: flex; align-items: center; min-height: 44px;">
          <span style="flex: 1; font-size: 17px; color: {{tintText}};">Show All 6</span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="{{c.label2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l6 6-6 6"></path></svg>
        </div>
      </div>
    </div>

    <div>
      <div style="font-size: 13px; font-weight: 600; color: {{c.label2}}; padding: 0 4px 8px;">Last Session</div>
      <div style="background: {{c.card}}; border-radius: 26px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;">
        <div style="width: 36px; height: 36px; border-radius: 999px; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; color: {{c.label}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 17px;">Yesterday</div>
          <div style="font-size: 15px; color: {{c.label2}};">17 min · all 6 exercises</div>
        </div>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 64px; border-radius: 999px; padding: 5px; display: flex; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; box-shadow: 0 10px 30px {{c.shadow}}; backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);">
    <a href="native-today.dc.html" aria-current="page" style="flex: 1; border-radius: 999px; background: {{c.fill}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{tintText}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line></svg>
      <span style="font-size: 10px; font-weight: 600;">Today</span>
    </a>
    <button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{c.label}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 7-8"></path><path d="M15 8h5v5"></path></svg>
      <span style="font-size: 10px; font-weight: 600;">Trends</span>
    </button>
    <button type="button" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: {{c.label}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="18" x2="20" y2="18"></line><circle cx="4.5" cy="6" r="1.3"></circle><circle cx="4.5" cy="12" r="1.3"></circle><circle cx="4.5" cy="18" r="1.3"></circle></svg>
      <span style="font-size: 10px; font-weight: 600;">Routines</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"tint":{"editor":"color","default":"#0066D6","options":["#0066D6","#C2410C","#0F7B6C","#7A3FD1"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const tint = this.props.tint ?? '#0066D6';
    const light = {
      bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', label2: '#6A6A6F',
      sep: 'rgba(60,60,67,0.22)', fill: 'rgba(120,120,128,0.14)', flame: '#D35400',
      glass: 'rgba(255,255,255,0.62)', glassBorder: 'rgba(255,255,255,0.9)', shadow: 'rgba(0,0,0,0.12)'
    };
    const night = {
      bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', label2: '#98989F',
      sep: 'rgba(84,84,88,0.6)', fill: 'rgba(120,120,128,0.3)', flame: '#FF9F0A',
      glass: 'rgba(44,44,48,0.55)', glassBorder: 'rgba(255,255,255,0.14)', shadow: 'rgba(0,0,0,0.5)'
    };
    return { c: dark ? night : light, tint, tintText: dark ? '#FFFFFF' : tint };
  }
}
</script>
</body>
</html>
