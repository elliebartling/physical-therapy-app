# XcodeGen fragments to merge into the target repo's project.yml.
# Not a complete spec — copy the relevant keys into each target.

settings:
  base:
    DEVELOPMENT_TEAM: "__TEAM_ID__"
    CODE_SIGN_STYLE: Automatic          # Debug / local device runs stay automatic

targets:
  App:
    info:
      properties:
        # Read from build settings so CI's build number reaches the app.
        # Without these, XcodeGen writes literal "1.0" / "1" and every upload
        # after the first is rejected as a duplicate build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon         # first upload is rejected without an icon
        ITSAppUsesNonExemptEncryption: false   # only if true for this app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"      # the ship workflow rewrites this line
      configs:
        # Release builds come only from the ship workflow, which signs with the
        # distribution certificate and passes the profile it fetched. Manual,
        # so CI never mints development certificates.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(APP_APPSTORE_PROFILE)"

  # Repeat for each app extension, with its own profile variable.
  Widgets:
    info:
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "$(WIDGETS_APPSTORE_PROFILE)"
